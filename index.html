n", "label": "reconversion"}, {"value": "reporter", "label": "reporter"}, {"value": "incertain", "label": "incertain"}], "maxChoices": null, "optional": true, "responsePolicy": {"allowSkip": true, "specialResponses": [], "privacySensitive": false, "applicabilityRuleId": null}}], "intro": "# Créer son activité : comprendre ses motivations et préparer ses choix\n\nCe questionnaire permettra de prendre du recul sur sa vie professionnelle et d’examiner la place que pourrait y occuper une activité indépendante.\n\nIl commencera par la personne : son parcours, ses satisfactions, ses envies de changement, ses valeurs et ses aspirations. Il aidera à comprendre ce qui motive cette réflexion aujourd’hui : une envie durable d’indépendance, une opportunité, un besoin de reconnaissance, une recherche de sens ou le souhait de sortir d’une situation insatisfaisante.\n\nIl permettra ensuite d’examiner plusieurs trajectoires possibles : créer une activité, tester progressivement une idée, évoluer dans le salariat, changer d’employeur ou se reconvertir.\n\nPour les personnes ayant déjà un projet, il aidera à faire le point sur l’offre envisagée, les clients potentiels, les compétences à mobiliser, les ressources disponibles et les contraintes à anticiper.\n\nÀ l’issue du parcours, une **synthèse personnalisée et explicable** présentera les motivations dominantes, les points d’appui, les incertitudes et les sujets à approfondir. Elle proposera des orientations possibles et un **plan d’action à 30, 60 et 90 jours** pour avancer concrètement.\n\nLes réponses resteront confidentielles, avec un fonctionnement local par défaut et sans transmission automatique.\n\nL’objectif sera de permettre à chacun de choisir une trajectoire professionnelle qui lui corresponde, avec une vision plus claire de ses envies et des conditions nécessaires pour les concrétiser.\n\n"};

 if(id==="Q11")extra+=contextControl("referenceRemuneration","L'activité à laquelle vous vous référez était-elle rémunérée ?",[["unknown","Non précisé"],["paid","Oui"],["unpaid","Non, cette activité n'était pas rémunérée"]]);
 if(id==="Q44")extra+=contextControl("salaryExperience","Avez-vous une expérience salariée, actuelle ou passée ?",[["unknown","Non précisé"],["present","Oui"],["none","Je n'ai jamais été salarié"]]);
 const scope=questionScope(session,id);
 if(scope.state==="out_of_scope")input='<p class="note">'+esc(scope.reason)+' Cette question ne contribue pas aux calculs dans ce contexte.</p>';
 return '<fieldset class="question" id="question-'+id+'"><legend>'+esc(fieldLabel(q))+'</legend><div class="qid">'+id+' · Facultatif'+(q.maxChoices?' · Trois choix maximum':'')+'</div>'+(e.requiresConfirmation?'<p class="note">Le sens de la question a changé. Sélectionnez à nouveau votre réponse pour la confirmer.</p>':"")+(e.reviewReasons?.length?'<p class="note">'+esc(e.reviewReasons.join(" "))+' Votre ancienne réponse est conservée ; choisissez une réponse ci-dessous ou passez la question.</p>':"")+input+extra+responseControls(q,e)+'</fieldset>';

}

function contextControl(key,label,options){return '<div class="context-field"><label for="context-'+key+'">'+esc(label)+'</label><select id="context-'+key+'" data-context="'+key+'">'+options.map(([v,l])=>'<option value="'+v+'" '+(session.context[key]===v?'selected':'')+'>'+esc(l)+'</option>').join("")+'</select></div>';}
function refreshQuestion(id){const field=document.getElementById('question-'+id);if(!field)return;field.outerHTML=questionHtml(id);const replacement=document.getElementById('question-'+id);wireInputs(replacement);replacement.tabIndex=-1;replacement.focus({preventScroll:true});}
function refreshTools(id){const tools=document.getElementById('tools-'+id);if(tools){tools.outerHTML=responseControls(qmap[id],session.answers[id]);wireSpecials(document.getElementById('tools-'+id));}}
function wireSpecials(root){
 root.querySelectorAll('[data-special]').forEach(el=>el.addEventListener('click',()=>{
  const id=el.dataset.special,e=session.answers[id];
  if(e.status==='answered'&&e.value!==null&&!confirm('Remplacer votre réponse à '+id+' par ce choix ?'))return;
  session=answerQuestion(session,id,el.dataset.statusValue);persist();refreshQuestion(id);
 }));
 root.querySelectorAll('[data-clear]').forEach(el=>el.addEventListener('click',()=>{
  const id=el.dataset.clear,value=session.answers[id].value;
  if((typeof value==='string'&&value.length>80||Array.isArray(value)&&value.join(' ').length>80)&&!confirm('Effacer le texte saisi pour '+id+' ?'))return;
  session=answerQuestion(session,id,'unanswered');persist();refreshQuestion(id);
 }));
}
function offerImport(text){
 const candidate=importSession(text);pendingImport={candidate,text,previousScreen:screen};screen='migration';render();focusMain();
}

function controls(){return '<div class="toolbar no-print">'+button("export","Télécharger mes réponses")+button("import","Importer un fichier")+button("save",persistent?"Désactiver la sauvegarde navigateur":"Activer la sauvegarde navigateur")+button("erase","Effacer et recommencer")+'</div><input id="file" type="file" accept=".json,application/json" hidden>';}
function wireControls(){
 on("export",()=>download("mes-reponses-activite.json",exportSession(session)));
 on("import",()=>document.getElementById("file").click());
 document.getElementById("file")?.addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  try{if(file.size>rules.maxImportBytes)throw Error("Fichier trop volumineux (1 Mo maximum).");offerImport(await file.text());}catch(err){notice=err.message;render();}
 });
 on("save",()=>{
  try{if(persistent){if(!confirm("Supprimer les sauvegardes de ce questionnaire dans ce navigateur, anciennes comprises ?"))return;localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);persistent=false;notice="Sauvegardes navigateur supprimées. Votre session reste en mémoire.";}else if(confirm("Conserver les réponses dans ce profil navigateur ? Les autres utilisateurs de ce profil pourraient y accéder. Vous pourrez les effacer.")){localStorage.setItem(KEY,exportSession(session));persistent=true;notice="Sauvegarde navigateur activée sur cet appareil.";}render();}catch{notice="Stockage indisponible. Utilisez le téléchargement JSON.";render();}
 });
 on("erase",()=>{if(confirm("Effacer cette session et sa sauvegarde navigateur ? Les fichiers déjà téléchargés ne seront pas supprimés.")){try{localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);}catch{}session=emptySession();persistent=false;batchIndex=0;screen="home";notice="Session effacée.";render();focusMain();}});
}
function download(name,content){const url=URL.createObjectURL(new Blob([content],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function wireInputs(root=main){
 root.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("change",()=>{
  const id=el.dataset.q,q=qmap[id];let value;
  if(q.type==="text")value=el.value.trim();
  else if(q.type==="multiple")value=[...main.querySelectorAll('input[name="'+id+'"]:checked')].map(x=>q.options[Number(x.dataset.index)].value);
  else value=q.options[Number(el.dataset.index)].value;
  const variant=+id.slice(1)>=80?route(session).variant:"original";
  const answer={status:value===""||(Array.isArray(value)&&!value.length)?"skipped":"answered",active:true,variant,value};
  if(answer.status!=="answered")answer.value=null;
  try{const needsRefresh=!!session.answers[id].reviewReasons?.length||session.answers[id].requiresConfirmation;session=answerQuestion(session,id,answer.status,answer.value);persist();refreshTools(id);main.querySelector(".live-error")?.remove();if(needsRefresh||id==="Q06"||id==="Q63")refreshQuestion(id);}
  catch(err){notice=err.message;if(el.type==="checkbox")el.checked=false;showError(err.message);}
 }));
 root.querySelectorAll("[data-skill]").forEach(el=>el.addEventListener("change",()=>{
  const value=[...main.querySelectorAll("[data-skill]")].map(x=>x.value.trim()).filter(Boolean);
  session=answerQuestion(session,"Q55",value.length?"answered":"skipped",value.length?value:null);persist();refreshTools("Q55");
 }));
 wireSpecials(root);
 root.querySelectorAll('[data-context]').forEach(el=>el.addEventListener('change',()=>{
  const previous=session.context[el.dataset.context];if((el.value==='none'||el.value==='unpaid')&&!confirm('Ce choix peut rendre certaines questions hors champ. Leurs anciennes réponses seront conservées mais exclues des calculs. Continuer ?')){el.value=previous;return;}session.context[el.dataset.context]=el.value;update();
  const affected=el.dataset.context==='professionalExperience'?['Q03']:el.dataset.context==='referenceRemuneration'?['Q11']:['Q44'];
  affected.forEach(refreshQuestion);
 }));
 root.querySelectorAll("[data-extra]").forEach(el=>el.addEventListener("change",()=>{session.complements[el.dataset.extra]=el.value;persist();}));
 root.querySelectorAll("[data-ranking]").forEach(el=>el.addEventListener("change",()=>{
  const selected=[...main.querySelectorAll("[data-ranking]")].map(x=>x.value).filter(Boolean);
  if(new Set(selected).size!==selected.length){el.value="";showError("Choisissez trois motivations différentes.");return;}
  session.complements.TOP_MOTIVATIONS=selected;persist();
 }));
}
function showError(message){main.querySelector(".live-error")?.remove();const p=document.createElement("p");p.className="error live-error";p.setAttribute("role","alert");p.textContent=message;main.prepend(p);}
function jump(id){const idx=batches().findIndex(group=>group.includes(id));if(idx>=0){batchIndex=idx;screen="questions";render();focusMain();}}
function proofLinks(ids){return ids.map(id=>'<button class="link" data-jump="'+id+'">'+id+'</button>').join(" ");}
function wireJump(){main.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>jump(el.dataset.jump)));}
function render(){
 if(screen!=="migration")update();
 const msg=notice?'<p role="status" class="note">'+esc(notice)+'</p>':"";
 notice="";
 if(screen==="home"){
  main.innerHTML=msg+'<div class="hero"><section class="intro"><p class="eyebrow">Votre parcours professionnel · votre décision</p>'+introHtml()+'</section><aside class="aside"><p class="eyebrow">Prendre le temps de réfléchir</p><div class="number">20–30<span style="font-size:1.1rem"> min visées</span></div><p class="small">Durée à mesurer lors des essais. Selon vos réponses, le parcours peut être plus long.</p><hr><p>Une personne.<br>Plusieurs trajectoires possibles.</p>'+button("start","Commencer mon parcours",true)+'<p class="small" style="margin-top:1rem">Vous pouvez passer une question, revenir en arrière et explorer sans avoir déjà une idée.</p><p class="small">Mémoire seule par défaut : sans sauvegarde choisie ou export, fermer ou recharger la page peut perdre vos réponses.</p>'+button("resume","Reprendre une sauvegarde locale")+'</aside></div>'+controls();
  on("start",()=>{screen="questions";batchIndex=0;render();focusMain();});
  on("resume",()=>{try{const text=localStorage.getItem(KEY)??localStorage.getItem(LEGACY_KEY);if(!text){notice="Aucune sauvegarde trouvée dans ce navigateur.";render();return;}offerImport(text);}catch(err){notice=err.message;render();}});
 }else if(screen==="migration"){
  const p=pendingImport,m=p.candidate.migration;
  main.innerHTML='<p class="eyebrow">Reprise en toute transparence</p><h1>Vérifier avant de reprendre.</h1><p>'+m.answered+' réponse(s) de fond conservée(s). '+m.reviewQuestions.length+' réponse(s) à revoir.</p><p>Format d’origine : '+esc(m.fromSchema)+'. Nouveau format : '+esc(rules.schemaVersion)+'. Votre session actuelle et les anciennes sauvegardes ne sont pas écrasées avant votre choix.</p>'+(m.reviewQuestions.length?'<p class="note">À vérifier : '+m.reviewQuestions.map(esc).join(', ')+'. Les indicateurs concernés seront suspendus, sans convertir ces réponses en zéro.</p>':'<p>Les réponses compatibles seront reprises ; le parcours sera recalculé.</p>')+'<div class="toolbar">'+button('backup-original',"Télécharger une copie d’origine")+button('accept-import',"Reprendre ces réponses",true)+button('cancel-import',"Annuler")+'</div><p class="small">La nouvelle session sera d’abord conservée en mémoire. La sauvegarde persistante reste un choix séparé.</p>';
  on('backup-original',()=>download('reponses-originales.json',p.text));
  on('accept-import',()=>{session=p.candidate;persistent=false;pendingImport=null;batchIndex=0;screen='review';notice='Réponses reprises. Les sauvegardes antérieures ont été conservées.';render();focusMain();});
  on('cancel-import',()=>{screen=p.previousScreen;pendingImport=null;render();focusMain();});

 }else if(screen==="questions"){
  const groups=batches();batchIndex=Math.min(batchIndex,groups.length-1);const ids=groups[batchIndex];const module=catalogue.modules.find(m=>m.id===qmap[ids[0]].module); ids.forEach(id=>{session.answers[id].visited=true;});persist();
  main.innerHTML=msg+'<div class="progress"><div class="progress-label"><span>Étape '+(batchIndex+1)+' sur environ '+groups.length+'</span><span>'+route(session).ids.length+' questions dans ce parcours</span></div><progress max="'+groups.length+'" value="'+(batchIndex+1)+'"></progress></div><p class="eyebrow">Module '+module.id+' sur 12</p><h1 style="font-size:2.5rem">'+esc(module.title)+'</h1><p class="small">Toutes les questions peuvent être ignorées. Une absence de réponse ne vaut jamais une réponse défavorable.</p>'+ids.map(questionHtml).join("")+(ids.includes("Q63")?'<div class="note"><label><input id="explore" type="checkbox" '+(session.preferences.explore?"checked":"")+'> Je souhaite explorer tous les approfondissements disponibles, même sans projet défini.</label><p class="small">Sans idée précise, le marché reste non évalué. L’exploration ne vous engage à aucune création.</p></div>':"")+'<div class="nav">'+button("back","← Précédent")+button("review","Relire mes réponses")+button("next",batchIndex===groups.length-1?"Voir ma synthèse":"Continuer →",true)+'</div>'+controls();
  document.getElementById("explore")?.addEventListener("change",e=>{session.preferences.explore=e.target.checked;update();});
  on("back",()=>{if(batchIndex===0)screen="home";else batchIndex--;render();focusMain();});
  on("next",()=>{if(batchIndex>=batches().length-1)screen="report";else batchIndex++;render();focusMain();});
  on("review",()=>{screen="review";render();focusMain();});wireInputs();
 }else if(screen==="review"){
  const r=route(session);
  main.innerHTML=msg+'<p class="eyebrow">Prendre du recul avant la synthèse</p><h1>Vos réponses, à votre rythme.</h1><p>Vous pouvez les modifier ou obtenir une synthèse partielle. Les questions ignorées ne seront pas remplacées par des valeurs.</p><table class="review"><thead><tr><th>Repère</th><th>Question</th><th>Réponse</th></tr></thead><tbody>'+r.ids.map(id=>'<tr><td>'+proofLinks([id])+'</td><td>'+esc(fieldLabel(qmap[id]))+'</td><td>'+esc(displayValue(session.answers[id]))+(session.answers[id].requiresConfirmation?" · à confirmer":"")+'</td></tr>').join("")+'</tbody></table><div class="nav">'+button("continue","Revenir au parcours")+button("report","Générer ma synthèse",true)+'</div>'+controls();
  on("continue",()=>{screen="questions";render();focusMain();});on("report",()=>{screen="report";render();focusMain();});wireJump();
 }else if(screen==="report"){
  const report=synthesize(session),name=id=>qmap[id].source_label;
  const card=([key,d])=>'<article class="card"><h3>'+labels[key]+'</h3><p class="score">'+(d.score===null?"—":Number(d.score.toFixed(1)))+(d.score===null?"":'<span style="font:1rem system-ui"> / 100</span>')+'</p><p>'+esc(d.category)+'</p><p class="small">'+d.answered+' réponse(s) utilisable(s) / '+d.applicable+' applicable(s). '+(d.status==="a_revoir"?"Calcul suspendu : ancienne réponse à vérifier ("+d.review.join(", ")+").":d.score===null?"Informations ou formulation insuffisantes pour ce calcul.":"Seuil de complétude atteint.")+'</p><p class="small">Appui : '+proofLinks(d.questions.length?d.questions:d.missing)+'</p></article>';
  const show=v=>v==null?"Non renseigné":esc(v);
  main.innerHTML=msg+'<p class="eyebrow">Une lecture de vos réponses · pas un verdict</p><h1>Éclairer votre prochaine étape.</h1><p>Cette synthèse explore vos motivations et votre préparation. Elle ne mesure ni une aptitude globale ni la viabilité économique d’une activité.</p><p class="small">Version '+esc(report.versions.app)+' · Référentiel '+esc(report.versions.questionnaire)+' · Règles '+esc(report.versions.rules)+'</p><div class="toolbar">'+button("review","Modifier mes réponses")+button("print","Imprimer / enregistrer en PDF",true)+'</div><section class="section"><h2>Votre situation et vos aspirations</h2><p>Situation : '+show(session.answers.Q02.status==="answered"?session.answers.Q02.value:null)+'. Trajectoire préférée à conditions comparables : '+show(session.answers.Q40.status==="answered"?session.answers.Q40.value:null)+'.</p><p>Orientation que vous avez choisie aujourd’hui : <strong>'+show(report.declaredOrientation)+'</strong>.</p><p>Critère de réussite : '+show(session.answers.Q84.status==="answered"?session.answers.Q84.value:null)+'.</p><p>Changements souhaités : '+show(session.answers.Q15.status==="answered"?session.answers.Q15.value:null)+'. Valeurs : '+show(session.answers.Q38.status==="answered"?session.answers.Q38.value:null)+'.</p><p style="white-space:pre-wrap">Journée idéale : '+show(session.answers.Q39.status==="answered"?session.answers.Q39.value:null)+'</p></section><section class="section"><h2>Vos motivations</h2><p class="small">Ces motivations ne s’ajoutent pas au score d’attrait pour l’indépendance. Sortir d’une insatisfaction ne prouve pas à lui seul le désir d’entreprendre.</p><table class="review"><tbody>'+catalogue.questions.filter(q=>q.module===4).map(q=>'<tr><th>'+q.id+'</th><td>'+esc(q.source_label)+'</td><td>'+esc(displayValue(session.answers[q.id]))+'</td></tr>').join("")+'</tbody></table><p>Priorités déclarées : '+(session.complements.TOP_MOTIVATIONS?.length?session.complements.TOP_MOTIVATIONS.map(id=>esc(name(id))).join(" → "):"non classées")+'</p></section><section class="section"><h2>Six dimensions, sans note globale</h2><div class="grid">'+Object.entries(report.dimensions).map(card).join("")+'<article class="card"><h3>Conditions de faisabilité</h3><p class="small">Lecture qualitative, sans moyenne.</p><p>Soutien : '+show(report.feasibility.relationnel.soutien)+'<br>Réseau : '+show(report.feasibility.relationnel.reseau)+'<br>Temps : '+show(report.feasibility.disponibilite)+' h/semaine</p><p>Réserve personnelle : '+show(report.feasibility.finance.reserve)+'<br>Investissements : '+show(report.feasibility.finance.investissements)+'</p><p>Contraintes identifiées : '+show(report.feasibility.contraintes.identification)+'<br>Obstacle : '+show(report.feasibility.contraintes.obstacle)+'</p><p class="small">Q72–Q79 · Une absence de réponse ne signifie pas une absence de ressources.</p></article></div></section><section class="section"><h2>Les preuves de demande restent distinctes</h2><p>Contacts clients : '+show(report.marketEvidence.contacts)+' · Éléments déclarés : '+show(report.marketEvidence.proof)+'.</p><p class="small">Un intérêt exprimé, une demande de devis, un engagement et une vente ne sont pas équivalents.</p></section><section class="section"><h2>Pistes et points à approfondir</h2>'+report.findings.map(f=>'<article class="note"><p>'+esc(f.text)+'</p><div class="small">Justification : '+proofLinks(f.proof)+(f.uncertain?" · Conclusion à confirmer":"")+'</div></article>').join("")+'<p>Vous pouvez aussi explorer une mobilité, une reconversion, une évolution de votre poste, ou prendre un temps de réflexion.</p></section><section class="section"><h2>Votre plan à 30, 60 et 90 jours</h2><div class="no-print"><label for="priority">Choisir le besoin prioritaire (facultatif)</label><select id="priority"><option value="">Proposition selon mes réponses</option>'+Object.entries(actions).map(([k,v])=>'<option value="'+k+'" '+(session.preferences.priority===k?"selected":"")+'>'+esc(v.title)+'</option>').join("")+'</select></div>'+(report.plan?'<h3 style="margin-top:1rem">'+esc(report.plan.title)+'</h3><div class="grid">'+report.plan.steps.map((text,i)=>'<div class="action-step"><b>'+[30,60,90][i]+' jours</b><p>'+esc(text)+'</p></div>').join("")+'</div><p class="small">Actions ajustables. Appui : '+(report.plan.proof.length?proofLinks(report.plan.proof):"choix explicite du besoin ou proposition de clarification")+'.</p>':'<p>Les informations sont insuffisantes pour proposer un plan personnalisé. Vous pouvez compléter les réponses ou choisir un besoin ci-dessus.</p>')+'</section>'+(report.conclusion?'<section class="section"><h2>Avec vos mots</h2><p style="white-space:pre-wrap">'+esc(report.conclusion)+'</p><p class="small">Texte reproduit sans interprétation automatique.</p></section>':"")+'<p class="note">Version de test : les seuils sont descriptifs, sans normes psychométriques. La durée et l’utilité seront évaluées auprès d’utilisateurs. L’enregistrement en PDF dépend de la boîte d’impression du navigateur.</p>'+controls();
  on("review",()=>{screen="review";render();focusMain();});on("print",()=>window.print());document.getElementById("priority").addEventListener("change",e=>{session.preferences.priority=e.target.value;render();});wireJump();
 }
 wireControls();
 document.title=screen==="questions"?"Étape "+(batchIndex+1)+" — Questionnaire de création d'activité":"Créer son activité — "+(screen==="report"?"Votre synthèse":"Éclairer vos choix");
}
document.getElementById("brand").addEventListener("click",e=>{e.preventDefault();screen="home";render();focusMain();});
render();
</script></body></html>
